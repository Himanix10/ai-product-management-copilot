version: '3.8'

services:
  ai-pm-copilot:
    build: .
    container_name: ai_pm_copilot_app
    ports:
      - "8501:8501"
    environment:
      - ENV=production
      - DATABASE_PATH=data/app.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped