[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pm-copilot"
version = "1.0.0"
description = "Multi-Agent System for AI-driven Product Management with Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.2"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=agents --cov=backend --cov-report=term-missing"
testpaths = ["tests"]